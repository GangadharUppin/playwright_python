apiVersion: v1
kind: Pod
metadata:
  generateName: playwright-test-pod-
  annotations:
    # Run this Pod as an Argo CD Sync hook
    argocd.argoproj.io/hook: Sync
    # Remove the Pod after it finishes (success or failure)
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,HookFailed
spec:
  restartPolicy: Never
  containers:
    - name: playwright
      image: gangadhar66/playwright-tests:13f4e134b98aeeed14d968c03c4cde141e4264be
      imagePullPolicy: Always
