apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-tests
  labels:
    app: playwright-tests
spec:
  replicas: 1
  selector:
    matchLabels:
      app: playwright-tests
  template:
    metadata:
      labels:
        app: playwright-tests
    spec:
      restartPolicy: Always
      containers:
        - name: playwright
          image: gangadhar66/playwright-tests:13f4e134b98aeeed14d968c03c4cde141e4264be
          imagePullPolicy: Always
